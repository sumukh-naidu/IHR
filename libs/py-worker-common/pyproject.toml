[project]
name = "ihr-worker-common"
version = "1.0.0"
description = "Shared worker framework for IHR Python workers (AI Spec v1.1 §3.2)"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2,<3",
  "pydantic>=2,<3",
  "jsonschema>=4.21",
  "boto3>=1.34",
  "structlog>=24",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "prometheus-client>=0.20",
  "fastapi>=0.110",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ihr_worker_common"]
