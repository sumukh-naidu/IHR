[project]
name = "ihr-ai-worker"
version = "1.0.0"
description = "IHR AI worker: Kimi-based CV and interview tasks (AI Specification v1.1)"
requires-python = ">=3.12"
dependencies = [
  "ihr-worker-common",
  "openai>=1,<2",
  "httpx>=0.27",
  "rapidfuzz>=3",
  "phonenumbers>=8.13",
  "pyyaml>=6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[tool.uv.sources]
ihr-worker-common = { path = "../../libs/py-worker-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ihr_ai_worker"]
