[project]
name = "ihr-speech-service"
version = "1.0.0"
description = "IHR speech service: STT (faster-whisper) and TTS (Azure/Polly) (AI Specification v1.1 ch. 11)"
requires-python = ">=3.12"
dependencies = [
  "ihr-worker-common",
  "av>=12",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]

[tool.uv.sources]
ihr-worker-common = { path = "../../libs/py-worker-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech"]
